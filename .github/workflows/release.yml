# Publicación de versiones: al empujar una etiqueta v* compila todo, comprueba, genera SHA256SUMS y crea el Release.
# Detalle y pasos en docs/CI.md. Sin secretos: solo el GITHUB_TOKEN; el permiso de escritura se concede
# únicamente al job `publish`.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12.11.2'
  WAILS_VERSION: v3.1.0
  TASK_VERSION: v3.54.0
  WIX_VERSION: 5.0.2
  GOFLAGS: -buildvcs=false

jobs:
  # La etiqueta (v0.3.0) debe coincidir con VERSION (0.3.0): si no, se aborta antes de compilar nada.
  verify:
    name: Etiqueta y VERSION
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # Historial completo: hace falta para comprobar que la etiqueta cuelga de la rama principal.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        # Nada de github.event.* dentro del script: el nombre de la rama principal llega por entorno.
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::VERSION no es a.b.c[-sufijo]."
            exit 1
          fi
          if [ "$tag" != "v${version}" ]; then
            echo "::error::La etiqueta $tag no coincide con VERSION (v${version}). Corrija VERSION o la etiqueta."
            exit 1
          fi
          # Solo se publica lo que ya está en la rama principal (una etiqueta sobre otra rama no publica).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::La etiqueta $tag apunta a un commit que no está en la rama ${DEFAULT_BRANCH}. Fusione y vuelva a etiquetar."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (MSI x64 y arm64, zips y servidor)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Sin cachés en el release: lo que se publica se construye desde cero (una caché envenenada en la rama principal no entra).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Instalar wails3, task y WiX (versiones fijas)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true   # un comando nativo que falla detiene el paso
          # Las herramientas quedan en el PATH de este paso (para `wix extension add`) y de los siguientes.
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION"
          go install "github.com/go-task/task/v3/cmd/task@$env:TASK_VERSION"
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION"
          wix extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"
          Join-Path (go env GOPATH) 'bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Join-Path $env:USERPROFILE '.dotnet\tools' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: task release:windows
        shell: pwsh
        run: task release:windows

      - name: Reunir los archivos de dist/ (solo archivos, sin carpetas)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -exec cp {} upload/ \;
          ls -l upload

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: upload/*
          if-no-files-found: error

  linux:
    name: Linux (servidor x64 y arm64, cruzado)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Instalar task (versión fija)
        run: |
          go install "github.com/go-task/task/v3/cmd/task@${TASK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # release:linux solo usa go, tar y sha256sum (sin wix, powershell ni wails).
      - name: task release:linux
        run: task release:linux

      - name: Reunir los archivos de dist/
        run: |
          set -euo pipefail
          mkdir -p upload
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -exec cp {} upload/ \;
          ls -l upload

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: upload/*
          if-no-files-found: error

  # El binario arm64 compilado de forma cruzada se ejecuta de verdad en un runner arm64.
  linux-arm64-native:
    name: Linux arm64 nativo (selftest del binario publicado)
    needs: [verify, linux]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: pkg

      - name: Extraer y probar el servidor arm64
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          archive="$(ls pkg/dConnector-server-*-linux-arm64.tar.gz)"
          echo "Archivo: $archive"
          mkdir -p x && tar -xzf "$archive" -C x
          bin="$(find x -type f -name 'dconnector-server' | head -n 1)"
          [ -n "$bin" ] || { echo "::error::No se encontró dconnector-server en $archive"; find x; exit 1; }
          chmod +x "$bin"
          file "$bin" || true
          got="$("$bin" --version)"
          echo "--version -> $got (esperado $VERSION)"
          [ "$got" = "$VERSION" ]
          "$bin" --selftest --data "$(mktemp -d)"

          work="$(mktemp -d)"
          export DCONNECTOR_DATA="$work/e2e"
          "$bin" --listen 127.0.0.1:18443 > "$work/server.log" 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 40); do
            if "$bin" --listen 127.0.0.1:18443 healthcheck; then ok=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat "$work/server.log"; kill "$pid" 2>/dev/null || true; exit 1; fi
          kill -TERM "$pid" || true

  # Imagen Docker: se construye y se comprueba su healthcheck, pero NO se publica (no hay registro configurado).
  # Para publicarla en GHCR (ghcr.io/<propietario>/<repo>) vea docs/CI.md: hace falta `packages: write`
  # en este job, `docker login ghcr.io` con GITHUB_TOKEN y `docker push`; el bloque está comentado abajo.
  docker:
    name: Imagen Docker (sin publicar)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Construir y esperar el healthcheck
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          docker build -f deploy/Dockerfile --build-arg VERSION="$VERSION" -t dconnector-server:release .
          docker run -d --name dc-rel dconnector-server:release
          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' dc-rel)"
            [ "$status" = healthy ] && break
            sleep 5
          done
          echo "Estado: $status"
          [ "$status" = healthy ] || { docker logs dc-rel || true; exit 1; }
      # --- GHCR (deshabilitado). Para activarlo: añada `permissions: {contents: read, packages: write}`
      # a este job y descomente. El nombre de la imagen debe ir en minúsculas.
      # - name: Publicar en GHCR
      #   env:
      #     GH_ACTOR: ${{ github.actor }}
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     REPO: ${{ github.repository }}
      #     VERSION: ${{ needs.verify.outputs.version }}
      #   run: |
      #     image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
      #     echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      #     docker tag dconnector-server:release "$image:$VERSION"
      #     docker tag dconnector-server:release "$image:latest"
      #     docker push "$image:$VERSION"
      #     docker push "$image:latest"

  # Publica la imagen en Docker Hub (linux/amd64 y linux/arm64) con los secretos DOCKERHUB_USERNAME y
  # DOCKERHUB_TOKEN del ENTORNO «Production» (Settings → Environments). Va aparte del Release: si este trabajo falla, el
  # Release se publica igual. Solo corre al publicar una versión (etiqueta v*), y la etiqueta `latest` se omite en
  # versiones con sufijo (p. ej. 0.4.0-prueba).
  docker-hub:
    name: Publicar imagen en Docker Hub
    needs: [verify, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Calcular las etiquetas de la imagen
        id: tags
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          image="${HUB_USER,,}/dconnector-server"
          tags="$image:$VERSION"
          case "$VERSION" in
            *-*) ;;                       # versión con sufijo: sin «latest»
            *) tags="$tags,$image:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Construir y publicar (amd64 y arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only

  # Único job con permiso de escritura: descarga todo, regenera SHA256SUMS y crea/actualiza el Release.
  publish:
    name: Publicar el Release
    needs: [verify, windows, linux, linux-arm64-native, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Comprobar que están TODOS los archivos esperados
        working-directory: release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          missing=0
          for a in x64 arm64; do
            for f in \
              "dConnector-${VERSION}-${a}.msi" \
              "dConnector-${VERSION}-portable-${a}.zip" \
              "dConnector-server-${VERSION}-windows-${a}.zip" \
              "echo-server-${VERSION}-windows-${a}.zip" \
              "dConnector-server-${VERSION}-linux-${a}.tar.gz" \
              "echo-server-${VERSION}-linux-${a}.tar.gz"; do
              if [ ! -f "$f" ]; then echo "::error::Falta $f"; missing=1; fi
            done
          done
          [ "$missing" = 0 ] || exit 1
          # Nada más que archivos de esta versión.
          extra="$(find . -mindepth 1 -maxdepth 1 \( ! -type f -o ! -name "*-${VERSION}-*" \) -printf '%f\n')"
          [ -z "$extra" ] || { echo "::error::Archivos inesperados en el Release:"; echo "$extra"; exit 1; }

      - name: Generar SHA256SUMS (después de reunir todo) y verificarlo
        working-directory: release
        run: |
          set -euo pipefail
          rm -f SHA256SUMS
          find . -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/files.txt"
          [ -s "$RUNNER_TEMP/files.txt" ] || { echo "::error::No hay archivos que publicar"; exit 1; }
          # sha256sum -- <archivos> en orden estable; formato «hash  nombre».
          xargs -d '\n' sha256sum -- < "$RUNNER_TEMP/files.txt" > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" = "$(wc -l < "$RUNNER_TEMP/files.txt")" ]

      # Se crea como BORRADOR, se suben los archivos y solo entonces se publica: un fallo a medias no deja un
      # Release público incompleto. --clobber solo reemplaza los activos del Release de ESTA etiqueta.
      - name: Crear o actualizar el Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="docs/RELEASE-NOTES-${tag}.md"
          files=(release/*)

          pre=false
          case "$tag" in *-*) pre=true ;; esac

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "El Release $tag ya existe: se suben los archivos con --clobber."
          else
            if [ -f "$notes" ]; then
              gh release create "$tag" --draft --verify-tag --title "dConnector ${tag}" --notes-file "$notes"
            else
              gh release create "$tag" --draft --verify-tag --title "dConnector ${tag}" --generate-notes
            fi
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          if [ -f "$notes" ]; then
            gh release edit "$tag" --notes-file "$notes"
          fi
          gh release edit "$tag" --draft=false --prerelease="$pre"
